<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Ledger History</title>
  <link rel="stylesheet" href="../../shared/css/global.css" />
  <link rel="stylesheet" href="./history.css" />
</head>
<body>

  <div class="App_Shell">

    <div class="Screen_Mask" id="screen-mask"></div>

    <header class="Top_Header">
      <div>
        <div class="Greeting_Text">Ledger History</div>
        <div class="Date_Text" id="date-box">--</div>
      </div>

      <!-- Capsule Nav (identical to Dashboard) -->
      <div class="Capsule_Nav" id="capsule-wrap">
        <div class="Capsule_Btn" id="capsule-btn">
          <span class="Capsule_Dot"></span>
          <span class="Capsule_Label">History</span>
          <svg class="Capsule_Arrow" viewBox="0 0 24 24" fill="none">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </div>
        <nav class="Capsule_Menu">
          <a href="../home/home.html" class="Menu_Link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
            Dashboard
          </a>
          <a href="history.html" class="Menu_Link Is_Active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line></svg>
            History
          </a>
          <a href="#" class="Menu_Link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
            Breakdown
          </a>
          <a href="#" class="Menu_Link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            Preferences
          </a>
        </nav>
      </div>
    </header>

    <main class="History_Viewport">

      <!-- 1. FILTER CARD -->
      <section class="Metric_Card">
        <div class="History_Card_Top_Line">

        </div>

        <div class="Range_Filter_Container">
          <button type="button" class="Filter_Chip" data-range="7">7 DAYS</button>
          <button type="button" class="Filter_Chip Is_Active" data-range="30">30 DAYS</button>
          <button type="button" class="Filter_Chip" data-range="all">ALL TIME</button>
        </div>
      </section>

      <!-- 2. PERIOD SPEND CARD -->
      <section class="Metric_Card">
        <div class="History_Card_Top_Line">
          <span class="Card_Label">SPENT IN PERIOD</span>
          <span class="Meta_Tag" id="history-tx-count">0 TX</span>
        </div>

        <div class="Amount_Display">
          <span class="Currency_Symbol">&#8377;</span>
          <span class="Amount_Value" id="history-total-spend">0.00</span>
        </div>
      </section>

      <!-- 3. TIMELINE (populated by history.js) -->
      <div class="Timeline_Container" id="transaction-timeline-container"></div>

    </main>
  </div>

  <!-- UNDO BANNER -->
  <div class="Undo_Notification_Banner" id="undo-notification-banner">
    <span class="Undo_Notification_Text" id="undo-notification-text">Deleted</span>
    <button type="button" class="Undo_Notification_Button" id="undo-notification-button">UNDO</button>
  </div>

  <!-- TRANSACTION DETAIL BOTTOM SHEET -->
  <div class="Sheet_Backdrop" id="detail-sheet-backdrop"></div>

  <section class="Detail_Sheet" id="detail-sheet">
    <div class="Sheet_Grabber"></div>

    <div class="Sheet_Header">
      <span class="Sheet_Title">TRANSACTION DETAILS</span>
      <button type="button" class="Sheet_Close_Btn" id="detail-close-btn" aria-label="Close">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <div class="Detail_Hero">
      <span class="Detail_Hero_Currency">-&#8377;</span>
      <span class="Detail_Hero_Amount" id="detail-field-amount">0.00</span>
    </div>

    <div class="Detail_Field_List">
      <div class="Detail_Field_Row">
        <span class="Field_Label">CATEGORY</span>
        <span class="Field_Value Field_Value_With_Dot">
          <span class="Detail_Cat_Dot" id="detail-field-category-dot"></span>
          <span id="detail-field-category">-</span>
        </span>
      </div>
      <div class="Detail_Field_Row">
        <span class="Field_Label">NOTE</span>
        <span class="Field_Value" id="detail-field-note">-</span>
      </div>
      <div class="Detail_Field_Row">
        <span class="Field_Label">DAY</span>
        <span class="Field_Value" id="detail-field-day">-</span>
      </div>
      <div class="Detail_Field_Row">
        <span class="Field_Label">DATE</span>
        <span class="Field_Value" id="detail-field-date">-</span>
      </div>
      <div class="Detail_Field_Row">
        <span class="Field_Label">TIME</span>
        <span class="Field_Value" id="detail-field-time">-</span>
      </div>
    </div>

    <button type="button" class="Sheet_Delete_Btn" id="detail-delete-btn">DELETE TRANSACTION</button>
  </section>

  <script src="../../shared/js/navbar.js"></script>
  <script src="./history.js"></script>
</body>
</html>
